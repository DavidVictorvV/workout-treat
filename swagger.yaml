openapi: 3.0.0
info:
  title: Workout Treats Backend API
  version: 1.0.0
  description: Comprehensive fitness tracking API with workout completion, points system, store purchases, and statistics

servers:
  - url: /.netlify/functions
    description: Netlify Functions server

paths:
  /test:
    post:
      summary: Test the Netlify function
      tags:
        - Testing
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Function is working!"

  /login:
    post:
      summary: User login with email and password
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  example: "password123"
              required:
                - email
                - password
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserProfile"
                  token:
                    type: string
                    description: Firebase ID token
                    example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        "400":
          description: Bad request - missing email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth-profile:
    get:
      summary: Get user profile with fitness data
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update user profile
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  example: "John Smith"
              required:
                - displayName
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserProfile"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workouts:
    get:
      summary: Get available workouts
      tags:
        - Workouts
      responses:
        "200":
          description: List of available workouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  workouts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workout"

  /workouts-complete:
    post:
      summary: Complete a workout
      tags:
        - Workouts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workoutId:
                  type: string
                  example: "workout_1"
              required:
                - workoutId
      responses:
        "200":
          description: Workout completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  pointsEarned:
                    type: integer
                    example: 15
                  newTotalPoints:
                    type: integer
                    example: 315
                  streakInfo:
                    type: object
                    properties:
                      currentStreak:
                        type: integer
                        example: 3
                      longestStreak:
                        type: integer
                        example: 5
                      isNewRecord:
                        type: boolean
                        example: false
        "400":
          description: Bad request - workout already completed today or invalid workout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workouts-history:
    get:
      summary: Get workout history
      tags:
        - Workouts
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
            example: "2024-01-01"
          description: Start date for filtering (YYYY-MM-DD)
        - name: endDate
          in: query
          schema:
            type: string
            format: date
            example: "2024-01-31"
          description: End date for filtering (YYYY-MM-DD)
      responses:
        "200":
          description: Workout history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  workouts:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkoutHistory"

  /store-items:
    get:
      summary: Get available store items
      tags:
        - Store
      responses:
        "200":
          description: List of available store items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StoreItem"

  /store-purchase:
    post:
      summary: Purchase a store item
      tags:
        - Store
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId:
                  type: string
                  example: "item_1"
              required:
                - itemId
      responses:
        "200":
          description: Purchase successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  pointsSpent:
                    type: integer
                    example: 100
                  newTotalPoints:
                    type: integer
                    example: 215
                  item:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "item_1"
                      name:
                        type: string
                        example: "Coca-Cola"
                      description:
                        type: string
                        example: "Classic 330ml"
        "400":
          description: Insufficient points or invalid item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /store-purchases:
    get:
      summary: Get purchase history
      tags:
        - Store
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Purchase history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchases:
                    type: array
                    items:
                      $ref: "#/components/schemas/Purchase"

  /stats-overview:
    get:
      summary: Get user statistics overview
      tags:
        - Statistics
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Statistics overview retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

  /stats-workouts:
    get:
      summary: Get workout statistics
      tags:
        - Statistics
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
            example: "2024-01-01"
          description: Start date for filtering (YYYY-MM-DD)
        - name: endDate
          in: query
          schema:
            type: string
            format: date
            example: "2024-01-31"
          description: End date for filtering (YYYY-MM-DD)
      responses:
        "200":
          description: Workout statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  workouts:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkoutHistory"
                  summary:
                    type: object
                    properties:
                      totalWorkouts:
                        type: integer
                        example: 10
                      pointsEarned:
                        type: integer
                        example: 150
                      uniqueWorkoutTypes:
                        type: integer
                        example: 5
                      activeDays:
                        type: integer
                        example: 8

  /stats-charts:
    get:
      summary: Get chart data for statistics
      tags:
        - Statistics
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [thisMonth, lastMonth]
            example: "thisMonth"
          description: Predefined period for chart data
        - name: startDate
          in: query
          schema:
            type: string
            format: date
            example: "2024-01-01"
          description: Custom start date (YYYY-MM-DD)
        - name: endDate
          in: query
          schema:
            type: string
            format: date
            example: "2024-01-31"
          description: Custom end date (YYYY-MM-DD)
      responses:
        "200":
          description: Chart data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  chartData:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          example: "2024-01-01"
                        overall:
                          type: integer
                          example: 2
                  workoutTypes:
                    type: array
                    items:
                      type: string
                    example: ["Running", "Push-ups", "Cycling"]
                  summary:
                    type: object
                    properties:
                      totalWorkouts:
                        type: integer
                        example: 25
                      activeDays:
                        type: integer
                        example: 15
                      pointsEarned:
                        type: integer
                        example: 375
                      averagePerDay:
                        type: number
                        format: float
                        example: 1.67

components:
  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: string
          example: "firebase_user_id_123"
        email:
          type: string
          format: email
          example: "user@example.com"
        displayName:
          type: string
          example: "John Doe"
        totalPoints:
          type: integer
          example: 315
        currentStreak:
          type: integer
          example: 3
        longestStreak:
          type: integer
          example: 5
        lastWorkoutDate:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
        memberSince:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"

    Workout:
      type: object
      properties:
        id:
          type: string
          example: "workout_1"
        name:
          type: string
          example: "Running or Jogging"
        icon:
          type: string
          example: "🏃‍♂️"
        category:
          type: string
          enum: [outdoor, indoor]
          example: "outdoor"
        duration:
          type: string
          example: "30 min"
        points:
          type: integer
          example: 15

    WorkoutHistory:
      type: object
      properties:
        id:
          type: string
          example: "history_1"
        workoutName:
          type: string
          example: "Running or Jogging"
        workoutIcon:
          type: string
          example: "🏃‍♂️"
        category:
          type: string
          example: "outdoor"
        pointsEarned:
          type: integer
          example: 15
        completedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
        date:
          type: string
          format: date
          example: "2024-01-15"

    StoreItem:
      type: object
      properties:
        id:
          type: string
          example: "item_1"
        name:
          type: string
          example: "Coca-Cola"
        description:
          type: string
          example: "Classic 330ml"
        icon:
          type: string
          example: "🥤"
        category:
          type: string
          enum: [all, drinks]
          example: "drinks"
        price:
          type: integer
          example: 100
        isAvailable:
          type: boolean
          example: true

    Purchase:
      type: object
      properties:
        id:
          type: string
          example: "purchase_1"
        itemName:
          type: string
          example: "Coca-Cola"
        itemIcon:
          type: string
          example: "🥤"
        pointsSpent:
          type: integer
          example: 100
        purchasedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    StatsOverview:
      type: object
      properties:
        totalPoints:
          type: integer
          example: 315
        currentStreak:
          type: integer
          example: 3
        longestStreak:
          type: integer
          example: 5
        totalWorkouts:
          type: integer
          example: 25
        totalPointsEarned:
          type: integer
          example: 375
        totalPointsSpent:
          type: integer
          example: 60
        uniqueWorkoutTypes:
          type: integer
          example: 8
        memberSince:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid credentials"
      required:
        - error

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token

tags:
  - name: Authentication
    description: User authentication and profile management
  - name: Workouts
    description: Workout management and completion
  - name: Store
    description: Store items and purchases
  - name: Statistics
    description: User statistics and analytics
  - name: Testing
    description: Testing and health check endpoints