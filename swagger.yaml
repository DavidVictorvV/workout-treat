openapi: 3.0.0
info:
  title: Netlify API
  version: 1.0.0
  description: Authentication API with email/password and Google Sign-In support

servers:
  - url: /.netlify/functions
    description: Netlify Functions server

paths:
  /test:
    post:
      summary: Test the Netlify function
      tags:
        - Testing
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Function is working!"

  /login:
    post:
      summary: User login with email and password
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  example: "password123"
              required:
                - email
                - password
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                type: object
                properties:
                  idToken:
                    type: string
                    description: Firebase ID token
                    example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                  refreshToken:
                    type: string
                    description: Firebase refresh token
                    example: "AEu4IL2X7Y9k..."
        "400":
          description: Bad request - missing email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /register:
    post:
      summary: Register new user with email and password
      tags:
        - Authentication
      description: |
        Create a new user account with email and password. 
        Returns Firebase tokens upon successful registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "newuser@example.com"
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: "password123"
                displayName:
                  type: string
                  description: Optional display name for the user
                  example: "John Doe"
              required:
                - email
                - password
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  idToken:
                    type: string
                    description: Firebase ID token
                    example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                  refreshToken:
                    type: string
                    description: Firebase refresh token
                    example: "AEu4IL2X7Y9k..."
                  localId:
                    type: string
                    description: Firebase user ID
                    example: "firebase_user_id_123"
                  email:
                    type: string
                    format: email
                    description: User's email address
                    example: "newuser@example.com"
                  displayName:
                    type: string
                    nullable: true
                    description: User's display name
                    example: "John Doe"
                  isNewUser:
                    type: boolean
                    description: Always true for registration
                    example: true
        "400":
          description: Bad request - validation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing_fields:
                  value:
                    error: "Email and password are required"
                weak_password:
                  value:
                    error: "Password must be at least 6 characters long"
                email_exists:
                  value:
                    error: "An account with this email already exists"
                invalid_email:
                  value:
                    error: "Invalid email address"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /google-signin:
    post:
      summary: Google Sign-In authentication
      tags:
        - Authentication
      description: |
        Sign in using Google ID token. The client should first authenticate with Google
        and obtain an ID token, then send it to this endpoint to get Firebase tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
                  description: Google ID token obtained from Google Sign-In
                  example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJhY2NvdW50cy5nb29nbGUuY29tIiwiYXVkIjoiMTIzNDU2Nzg5MC1hYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5ei5hcHBzLmdvb2dsZXVzZXJjb250ZW50LmNvbSIsInN1YiI6IjEyMzQ1Njc4OTAifQ..."
                testMode:
                  type: boolean
                  description: Enable test mode for Swagger testing (returns mock data without calling Firebase)
                  example: true
                  default: false
              required:
                - idToken
      responses:
        "200":
          description: Google Sign-In success
          content:
            application/json:
              schema:
                type: object
                properties:
                  idToken:
                    type: string
                    description: Firebase ID token
                    example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                  refreshToken:
                    type: string
                    description: Firebase refresh token
                    example: "AEu4IL2X7Y9k..."
                  localId:
                    type: string
                    description: Firebase user ID
                    example: "firebase_user_id_123"
                  email:
                    type: string
                    format: email
                    description: User's email address
                    example: "user@gmail.com"
                  displayName:
                    type: string
                    description: User's display name
                    example: "John Doe"
                  photoUrl:
                    type: string
                    format: uri
                    description: User's profile photo URL
                    example: "https://lh3.googleusercontent.com/a/photo.jpg"
                  isNewUser:
                    type: boolean
                    description: Whether this is a new user registration
                    example: false
        "400":
          description: Bad request - missing Google ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - invalid Google ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /get-user:
    get:
      summary: Get user data by userId or displayName
      tags:
        - Account Management
      description: |
        Retrieves user information based on a single `id` query parameter.
        - First attempts to fetch from Firebase Authentication by user ID.
        - If not found, falls back to Firestore to look up by display name.

        **Note:** This method assumes no collision between display names and user IDs.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            example: "John Doe"
          description: |
            Either a Firebase user ID (localId) or a display name.
            The backend will attempt both methods to find the user.
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    description: Firebase user ID
                    example: "firebase_user_id_123"
                  email:
                    type: string
                    format: email
                    description: User's email
                    example: "user@example.com"
                  displayName:
                    type: string
                    description: Display name of the user
                    example: "John Doe"
                  photoUrl:
                    type: string
                    format: uri
                    description: Profile photo URL
                    example: "https://lh3.googleusercontent.com/a/photo.jpg"
                  source:
                    type: string
                    enum: [auth, firestore]
                    description: Where the user was found (auth = Firebase Auth, firestore = Firestore)
                    example: "auth"
        "400":
          description: Missing `id` parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /delete-account:
    delete:
      summary: Delete user account and all associated data
      tags:
        - Account Management
      description: |
        Permanently delete the user account from Firebase Authentication and remove all
        associated data from Firestore. This action cannot be undone.

        **Requirements:**
        - Valid Firebase ID token in Authorization header
        - User must be authenticated

        **What gets deleted:**
        - User account from Firebase Authentication
        - userData document from Firestore
        - Any other user-related documents across collections
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                    example: "Account deleted successfully"
                  userId:
                    type: string
                    description: ID of the deleted user
                    example: "firebase_user_id_123"
                  email:
                    type: string
                    format: email
                    description: Email of the deleted user
                    example: "user@example.com"
                  deletedAt:
                    type: string
                    format: date-time
                    description: ISO timestamp of when the account was deleted
                    example: "2024-01-15T10:30:45.123Z"
        "401":
          description: Unauthorized - missing, invalid, or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing_token:
                  value:
                    error: "Authorization header with Bearer token required"
                invalid_token:
                  value:
                    error: "Invalid or expired token"
        "405":
          description: Method not allowed - must use DELETE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                    example: "Failed to delete account"
                  details:
                    type: string
                    description: Detailed error information
                    example: "Firebase authentication error details"

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid credentials"
      required:
        - error

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: Account Management
    description: Account management operations
  - name: Testing
    description: Testing and health check endpoints
