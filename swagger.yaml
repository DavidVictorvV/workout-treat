openapi: 3.0.0
info:
  title: Netlify API
  version: 1.0.0
  description: Authentication API with email/password and Google Sign-In support

servers:
  - url: /.netlify/functions
    description: Netlify Functions server

paths:
  /test:
    post:
      summary: Test the Netlify function
      tags:
        - Testing
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Function is working!"

  /login:
    post:
      summary: User login with email and password
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  example: "password123"
              required:
                - email
                - password
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                type: object
                properties:
                  idToken:
                    type: string
                    description: Firebase ID token
                    example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                  refreshToken:
                    type: string
                    description: Firebase refresh token
                    example: "AEu4IL2X7Y9k..."
        "400":
          description: Bad request - missing email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /register:
    post:
      summary: Register new user with email and password
      tags:
        - Authentication
      description: |
        Create a new user account with email and password. 
        Returns Firebase tokens upon successful registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "newuser@example.com"
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: "password123"
                displayName:
                  type: string
                  description: Optional display name for the user
                  example: "John Doe"
              required:
                - email
                - password
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  idToken:
                    type: string
                    description: Firebase ID token
                    example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                  refreshToken:
                    type: string
                    description: Firebase refresh token
                    example: "AEu4IL2X7Y9k..."
                  localId:
                    type: string
                    description: Firebase user ID
                    example: "firebase_user_id_123"
                  email:
                    type: string
                    format: email
                    description: User's email address
                    example: "newuser@example.com"
                  displayName:
                    type: string
                    nullable: true
                    description: User's display name
                    example: "John Doe"
                  isNewUser:
                    type: boolean
                    description: Always true for registration
                    example: true
        "400":
          description: Bad request - validation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing_fields:
                  value:
                    error: "Email and password are required"
                weak_password:
                  value:
                    error: "Password must be at least 6 characters long"
                email_exists:
                  value:
                    error: "An account with this email already exists"
                invalid_email:
                  value:
                    error: "Invalid email address"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /google-signin:
    post:
      summary: Google Sign-In authentication
      tags:
        - Authentication
      description: |
        Sign in using Google ID token. The client should first authenticate with Google
        and obtain an ID token, then send it to this endpoint to get Firebase tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
                  description: Google ID token obtained from Google Sign-In
                  example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJhY2NvdW50cy5nb29nbGUuY29tIiwiYXVkIjoiMTIzNDU2Nzg5MC1hYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5ei5hcHBzLmdvb2dsZXVzZXJjb250ZW50LmNvbSIsInN1YiI6IjEyMzQ1Njc4OTAifQ..."
                testMode:
                  type: boolean
                  description: Enable test mode for Swagger testing (returns mock data without calling Firebase)
                  example: true
                  default: false
              required:
                - idToken
      responses:
        "200":
          description: Google Sign-In success
          content:
            application/json:
              schema:
                type: object
                properties:
                  idToken:
                    type: string
                    description: Firebase ID token
                    example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                  refreshToken:
                    type: string
                    description: Firebase refresh token
                    example: "AEu4IL2X7Y9k..."
                  localId:
                    type: string
                    description: Firebase user ID
                    example: "firebase_user_id_123"
                  email:
                    type: string
                    format: email
                    description: User's email address
                    example: "user@gmail.com"
                  displayName:
                    type: string
                    description: User's display name
                    example: "John Doe"
                  photoUrl:
                    type: string
                    format: uri
                    description: User's profile photo URL
                    example: "https://lh3.googleusercontent.com/a/photo.jpg"
                  isNewUser:
                    type: boolean
                    description: Whether this is a new user registration
                    example: false
        "400":
          description: Bad request - missing Google ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - invalid Google ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid credentials"
      required:
        - error

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: Testing
    description: Testing and health check endpoints
